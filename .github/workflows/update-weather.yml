name: Update Weather Data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "workers/scheduler/wrangler.toml"

permissions:
  contents: read

jobs:
  # Keep cron reconciliation outside the update queue: a newer dispatch may
  # replace a pending update, but must never cancel a pending cron change.
  sync_scheduler:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@v1
        with:
          version: 0.1.15
          cache: true
      - run: vp install --frozen-lockfile
      - name: Apply and verify scheduler cron
        run: vp dlx tsx scripts/sync-scheduler.ts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  update:
    needs: sync_scheduler
    if: ${{ always() && !cancelled() && (needs.sync_scheduler.result == 'success' || needs.sync_scheduler.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Serialize publishers while allowing a newer update to replace a stale one.
    concurrency:
      group: weather-production
      cancel-in-progress: false

    steps:
      # リポジトリをチェックアウト
      - uses: actions/checkout@v6

      # Node.js + pnpm + vp のセットアップを一括で行う
      - uses: voidzero-dev/setup-vp@v1
        with:
          version: 0.1.15 # Match pnpm-lock.yaml; avoid changing the toolchain during data updates
          cache: true

      # 依存関係インストール
      - run: vp install

      # ダムデータを都道府県別に分割（public/data/dams/）
      - run: vp dlx tsx scripts/split-dams.ts

      # 天気データ取得
      - id: fetch-weather
        run: vp dlx tsx scripts/fetch-weather.ts

      # 全ダム・全都道府県・当日/翌日の予報が揃わなければ配信を止める
      - id: validate-weather
        run: vp dlx tsx scripts/validate-weather.ts

      # ダム貯水率データ取得
      - id: fetch-storage
        continue-on-error: true
        run: vp dlx tsx scripts/fetch-dam-storage.ts

      # サイトマップ生成 + 型チェック + ビルド（天気データ取得成功時のみ実行）
      - if: success()
        run: |
          vp dlx tsx scripts/generate-sitemap.ts
          vp exec tsc -b
          vp build
          vp dlx tsx scripts/prerender.ts

      # Cloudflare Pages へデプロイ（天気データ取得成功時のみ実行）
      - if: success()
        run: vp exec wrangler pages deploy dist --project-name=japan-dam-weather --commit-message="$(git log -1 --format='%h %s' | cut -c1-100)"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
