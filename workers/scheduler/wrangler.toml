name = "dam-weather-scheduler"
main = "src/index.ts"
compatibility_date = "2025-04-01"
workers_dev = false
preview_urls = false

[triggers]
# UTC 01:00 / 08:00 / 16:00 = JST 10:00 / 17:00 / 01:00
# Weather and dam storage are refreshed together, three times per day.
crons = ["0 1,8,16 * * *"]

[vars]
GITHUB_REPO = "shiroemons/dam-weather-app"
GITHUB_WORKFLOW_ID = "update-weather.yml"
